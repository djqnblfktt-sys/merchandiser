<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мерчандайзер CSD</title>
<meta name="description" content="Короткая игра: вы — мерчандайзер супермаркета. Расставьте напитки, подберите рекламу и посоветуйте покупателям. 10–15 минут.">
<meta property="og:title" content="Игра «Мерчандайзер»">
<meta property="og:description" content="Вы — мерчандайзер супермаркета. Расставьте напитки, подберите рекламу и посоветуйте покупателям. 10–15 минут.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#F6F8F5; --ink:#15201D; --muted:#5A6964; --line:#D5DDD7;
  --rack:#1D4A45; --rack-2:#2B655E; --rack-edge:#133330; --lane:#F7F9F6; --lane-ink:#6C7B76;
  --tag:#FFD646; --tag-ink:#2A2200; --tag-edge:#D9B21F;
  --fridge:#DCEEF3; --fridge-edge:#96C6D3; --checkout:#F7E6DA; --checkout-edge:#E2B89A;
  --focus:#1F6FEB; --ok:#227A4B; --ok-bg:#DDF1E5; --warn:#9A5B00; --warn-bg:#FCEFD6; --err:#B3321F; --err-bg:#FBE3DE;
  --shadow:0 1px 2px rgba(20,40,35,.08),0 4px 14px rgba(20,40,35,.06);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1716; --surface:#172220; --surface-2:#1C2926; --ink:#E6EDE9; --muted:#97A7A1; --line:#2C3B37;
    --rack:#0B2724; --rack-2:#184640; --rack-edge:#061917; --lane:#1B2825; --lane-ink:#8A9C96;
    --tag:#F5CD3A; --tag-ink:#231C00; --tag-edge:#B8961A;
    --fridge:#14303A; --fridge-edge:#2F6A7B; --checkout:#35261D; --checkout-edge:#6B4A35;
    --focus:#6CA6FF; --ok:#6CD19A; --ok-bg:#16382A; --warn:#F1B75A; --warn-bg:#3A2B12; --err:#FF8C78; --err-bg:#3E1D18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1716; --surface:#172220; --surface-2:#1C2926; --ink:#E6EDE9; --muted:#97A7A1; --line:#2C3B37;
  --rack:#0B2724; --rack-2:#184640; --rack-edge:#061917; --lane:#1B2825; --lane-ink:#8A9C96;
  --tag:#F5CD3A; --tag-ink:#231C00; --tag-edge:#B8961A;
  --fridge:#14303A; --fridge-edge:#2F6A7B; --checkout:#35261D; --checkout-edge:#6B4A35;
  --focus:#6CA6FF; --ok:#6CD19A; --ok-bg:#16382A; --warn:#F1B75A; --warn-bg:#3A2B12; --err:#FF8C78; --err-bg:#3E1D18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--rack);color:#EAF4F1;border-bottom:3px solid var(--tag)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font-size:12px}
.steps{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;font-size:12.5px;color:rgba(234,244,241,.65);white-space:nowrap}
.step b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);background:rgba(255,255,255,.1)}
.step.on{background:rgba(255,255,255,.12);color:#fff}
.step.on b{background:var(--tag);color:var(--tag-ink)}
.step.done b{background:rgba(255,214,70,.35);color:#fff}
.bar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.langs{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
.langs button{border:0;background:transparent;color:rgba(234,244,241,.8);padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer}
.langs button.on{background:var(--tag);color:var(--tag-ink)}
.sync{font-size:11.5px;color:rgba(234,244,241,.7);white-space:nowrap;display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:#7BD9A4;display:inline-block}
.sync.busy i{background:var(--tag)}
.sync.bad i{background:#FF8C78}
.btn-bar{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.btn-bar:hover{background:rgba(255,255,255,.1)}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tag);border-color:var(--tag-edge);color:var(--tag-ink)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.dark{background:var(--rack);border-color:var(--rack);color:#fff}
.btn.danger{color:var(--err);border-color:currentColor;background:transparent}
.btn.small{min-height:34px;padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:76px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.notice.err{background:var(--err-bg);color:var(--err)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* screen head */
.screen{padding-block:22px 120px;display:flex;flex-direction:column;gap:18px}
.shead{display:flex;flex-direction:column;gap:6px;max-width:760px}
.shead .eyebrow{font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shead h2{font-size:clamp(22px,3.2vw,30px)}
.shead p{margin:0;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex;align-items:center;gap:12px;min-height:70px;padding-block:10px}
.nav .msg{flex:1;font-size:13.5px;color:var(--err);min-width:0}
.nav .msg.info{color:var(--muted)}

.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:.92;transform-origin:center;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28))}
body.dragging,body.dragging *{cursor:grabbing!important}
[data-drop].hot{outline:2px dashed var(--tag-edge);outline-offset:-2px;background:color-mix(in srgb,var(--tag) 22%,transparent)!important}
body.picking [data-drop]{cursor:pointer}
body.picking [data-drop]:not(.item){box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tag-edge) 55%,transparent)}
.plist{padding:6px 14px 14px}
.plist summary{cursor:pointer;font-weight:600;padding:10px 0;font-size:14px}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 6px;border-bottom:1px solid var(--line)}
.ptable td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable select{min-height:34px;padding:4px 6px}
.tscroll{overflow-x:auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sum{padding:16px;display:flex;flex-direction:column;gap:4px}
.sum b{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
/* admin */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--tag-edge)}
.atable{width:100%;border-collapse:collapse;font-size:13.5px}
.atable th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.atable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.atable input[type=text],.atable input:not([type]){min-height:34px;padding:5px 8px;min-width:140px}
.atable input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.atable tr.off td{opacity:.55}
.num{font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,390px),1fr));gap:12px}
.char-ed{padding:14px;display:grid;grid-template-columns:110px 1fr;gap:12px}
.char-ed svg{width:110px;height:auto}
.char-ed .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.char-ed .fields .full{grid-column:1/-1}
.char-ed select,.char-ed input{min-height:34px;padding:4px 8px;font-size:13px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wip{background:var(--warn-bg);color:var(--warn)}
.export{padding:16px;display:flex;flex-direction:column;gap:12px}
.export .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* packs */
.pack{position:relative;display:inline-block;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.22))}
.pack svg{display:block;width:100%;height:100%}
.pack-label{position:absolute;left:8%;right:8%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.02;text-transform:uppercase;letter-spacing:.01em;word-break:break-word;hyphens:auto;overflow:hidden;font-family:var(--f-body)}
.pack.glass .pack-label{left:6%;right:6%}
.pack.photo img{height:100%;width:auto;display:block}
.item{border:0;background:transparent;padding:4px 3px 0;border-radius:10px;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;transition:transform .18s}
.item:hover{transform:translateY(-3px)}
.item.sel{background:rgba(255,214,70,.45);outline:2px solid var(--tag-edge)}
@keyframes settle{0%{transform:translateY(-18px)}60%{transform:translateY(2px)}100%{transform:none}}
.settle{animation:settle .35s ease-out}

/* warehouse */
.warehouse{display:flex;gap:14px;align-items:stretch;margin-bottom:16px;background:linear-gradient(180deg,#C99A62,#B88550);border-radius:12px;padding:10px 12px 12px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 6px 16px rgba(60,40,10,.18);position:relative}
.warehouse::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.wh-label{flex:none;display:flex;flex-direction:column;justify-content:center;gap:2px;color:#3B2711;padding-right:12px;border-right:2px dashed rgba(59,39,17,.35);min-width:120px}
.wh-label b{font:700 14px var(--f-display)}
.wh-label span{font-size:12px;opacity:.8}
.wh-label .stamp{font:700 10px var(--f-mono);border:2px solid #7a3b16;color:#7a3b16;border-radius:4px;padding:1px 5px;transform:rotate(-4deg);align-self:flex-start;margin-top:4px}
.wh-items{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-end;flex:1;min-width:0;background:rgba(60,35,10,.18);border-radius:8px;padding:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}

/* store scene */
.store{background:linear-gradient(180deg,var(--wall) 0%,var(--wall-2) 100%);border-radius:16px;padding:14px;display:grid;grid-template-columns:1.55fr 1fr;gap:14px;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 30px rgba(20,30,25,.12)}
.store::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 60px,rgba(255,255,255,.3) 60px 120px);filter:blur(2px);opacity:.7}
.sign{background:var(--chrome);color:#fff;border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font:700 12.5px var(--f-display);letter-spacing:.03em;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 6px 18px rgba(29,74,69,.35)}
.sign i{font-style:normal;color:var(--tag);font:600 10.5px var(--f-mono)}
/* gondola */
.gondola{display:flex;flex-direction:column;gap:8px;position:relative;padding:0 12px}
.gondola::before,.gondola::after{content:"";position:absolute;top:34px;bottom:0;width:10px;border-radius:3px;background:linear-gradient(90deg,var(--metal-3),var(--metal-1) 45%,var(--metal-2));z-index:2}
.gondola::before{left:0}.gondola::after{right:0}
.g-body{background-color:var(--peg);background-image:radial-gradient(circle,rgba(0,0,0,.13) 1.3px,transparent 1.7px);background-size:14px 14px;border-radius:3px;padding:10px 0 0;display:flex;flex-direction:column;box-shadow:inset 0 8px 18px rgba(0,0,0,.08)}
.shelf{position:relative}
.bays{display:grid;grid-template-columns:repeat(3,1fr);min-height:142px;position:relative}
.bay{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:0 2px;padding:18px 4px 0;position:relative;cursor:pointer;border-radius:4px 4px 0 0;transition:background .15s}
.bay+.bay{border-left:2px solid rgba(110,120,125,.25)}
.bay-name{position:absolute;top:3px;left:0;right:0;text-align:center;font:600 9px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.8}
.bay.hot,.bay:hover{background:rgba(255,214,70,.18)}
.picking .bay{box-shadow:inset 0 0 0 2px rgba(217,178,31,.55)}
.surface{height:9px;background:linear-gradient(180deg,#d7dcdf,#bcc4c8);margin:0 -2px;transform:perspective(200px) rotateX(35deg);transform-origin:bottom}
.lip{height:26px;background:linear-gradient(180deg,var(--metal-1),var(--metal-2) 70%,var(--metal-3));display:grid;grid-template-columns:auto 1fr 1fr 1fr;align-items:center;gap:0;padding:0 8px;margin:0 -2px;border-radius:2px;box-shadow:0 5px 7px rgba(0,0,0,.22)}
.lip-name{font:700 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#2c3437;background:#F7F7F2;border-radius:3px;padding:2px 6px;margin-right:8px;white-space:nowrap}
.lip-slot{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}
.ptag{border:0;cursor:pointer;background:var(--tag);color:var(--tag-ink);border-radius:2px;padding:1px 6px 2px;font:700 10px/1.1 var(--f-mono);min-width:30px;box-shadow:0 1px 0 rgba(0,0,0,.25);display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.ptag small{font:600 6.5px var(--f-body);text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.ptag.none{background:#fff;color:var(--err);outline:1.5px dashed var(--err)}
.ptag.p1{background:#1B7F4D;color:#fff}.ptag.p3{background:#D5DADC;color:#2c3437}
/* fridge */
.fridge{display:flex;flex-direction:column;gap:8px}
.f-body{background:var(--fridge-frame);border-radius:10px 10px 4px 4px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.door{position:relative;background:linear-gradient(180deg,var(--led) 0,#9fc6d6 3%,var(--fridge-in) 16%,#1c2f39 100%);border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;min-height:280px;padding:22px 3px 0;cursor:pointer;overflow:hidden}
.door::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,.18) 0 10%,transparent 10% 34%,rgba(255,255,255,.08) 34% 40%,transparent 40%);pointer-events:none;z-index:3}
.door::after{content:"";position:absolute;right:4px;top:30%;height:36%;width:4px;border-radius:2px;background:linear-gradient(90deg,#9aa3a8,#eef1f2);z-index:4}
.door .bay-name{color:#bfe3f2;top:8px;z-index:2}
.door-items{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:0 2px;position:relative;z-index:1;padding-bottom:0}
.wire{height:8px;margin:0 -3px;background:repeating-linear-gradient(90deg,#aab4b9 0 2px,transparent 2px 7px),linear-gradient(180deg,#c9d1d5,#7f8a90);border-top:2px solid #d9e0e3}
.door-tags{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;padding:5px 0 6px;background:#0f1a20;margin:0 -3px;min-height:30px}
.picking .door{box-shadow:inset 0 0 0 2px rgba(255,214,70,.7)}
.door.hot{box-shadow:inset 0 0 0 3px var(--tag)}
.f-base{height:22px;background:linear-gradient(180deg,#3a4247,#1f2427);border-radius:0 0 6px 6px;margin-top:-8px;display:flex;align-items:center;justify-content:center;gap:4px}
.f-base i{width:30px;height:3px;background:#56626a;border-radius:2px}
/* checkout */
.checkout{grid-column:1/-1;display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:end}
.counter{position:relative;display:flex;flex-direction:column}
.impulse{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
.impulse .bay{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.1));border:2px solid var(--metal-2);border-bottom:0;border-radius:6px 6px 0 0;min-height:118px}
.impulse .bay+.bay{border-left:2px solid var(--metal-2)}
.belt{height:34px;background:var(--belt);border-radius:6px 6px 0 0;position:relative;overflow:hidden;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.belt::before{content:"";position:absolute;inset:6px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 3px,transparent 3px 22px);animation:belt 6s linear infinite}
@keyframes belt{to{transform:translateX(-22px)}}
.counter-front{height:44px;background:linear-gradient(180deg,var(--counter),#b09a7a);border-radius:0 0 6px 6px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;align-items:center;padding:0 12px}
.till{background:#22282b;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;align-self:stretch;justify-content:flex-end}
.till-screen{background:#0d2a1f;color:#6CF0A8;font:600 13px var(--f-mono);border-radius:5px;padding:8px;text-align:right;box-shadow:inset 0 0 12px rgba(108,240,168,.2)}
.till-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.till-keys i{height:14px;border-radius:3px;background:#3b4347}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center;margin-top:12px}

/* shoppers */
.queue{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.q{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:58px;height:66px;padding:0;overflow:hidden;cursor:pointer;position:relative;display:flex;align-items:flex-end;justify-content:center}

.q.done::after{content:"✓";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-size:10.5px;display:grid;place-items:center}
.shop-scene{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 10px 30px rgba(20,30,25,.12)}
.aisle{position:relative;min-height:470px;background:linear-gradient(180deg,#ECE8DF 0 58%,#D6D2C8 58% 100%);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
:root[data-theme="dark"] .aisle{background:linear-gradient(180deg,#2c2b27 0 58%,#23221f 58% 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .aisle{background:linear-gradient(180deg,#2c2b27 0 58%,#23221f 58% 100%)}}
.aisle-shelves{position:absolute;left:-10%;right:-10%;top:8%;height:48%;display:flex;flex-direction:column;justify-content:space-around;filter:blur(3px);opacity:.38}

.floor{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 70px),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 40px);transform:perspective(300px) rotateX(45deg);transform-origin:bottom}
.person-wrap{position:relative;z-index:2;width:min(250px,70%);margin-bottom:14px;animation:walkin .6s ease-out}
@keyframes walkin{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.person{width:100%;height:auto;display:block}
.bubble{position:absolute;z-index:3;top:26px;right:18px;left:18px;background:#fff;color:#1b1f1e;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.14);max-width:320px;margin-left:auto}
.bubble::after{content:"";position:absolute;left:34%;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble b{display:block;font:700 13px var(--f-display);margin-bottom:2px}
.id-card{position:absolute;z-index:3;left:14px;bottom:14px;right:14px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#1b1f1e;border:1px solid rgba(0,0,0,.08)}
.chip i{font-style:normal;color:#5c6964}
.shop-right{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.basket{position:relative;height:190px;display:flex;justify-content:center;align-items:flex-end}
.basket-items{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;width:190px;display:flex;justify-content:center;align-items:flex-end;gap:0;z-index:1}
.basket-items .pack{margin:0 -5px}
.basket-svg{position:relative;z-index:2;width:220px;height:auto}
.basket-empty{position:absolute;top:30px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.mini-shelf{background:var(--peg);background-image:radial-gradient(circle,rgba(0,0,0,.1) 1.2px,transparent 1.6px);background-size:12px 12px;border-radius:8px 8px 0 0;padding:8px 6px 0;display:flex;flex-wrap:wrap;gap:0 2px;align-items:flex-end;justify-content:center}
.mini-lip{height:10px;background:linear-gradient(180deg,var(--metal-1),var(--metal-3));border-radius:2px;box-shadow:0 4px 5px rgba(0,0,0,.2);margin-bottom:6px}
.pick{border:0;background:transparent;padding:4px 2px 2px;border-radius:8px;cursor:pointer;position:relative;transition:transform .15s,opacity .15s}
.pick:hover{transform:translateY(-3px)}
.pick.on{opacity:.28;transform:none}
.sits{display:flex;flex-wrap:wrap;gap:6px}
.sit{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;text-align:left;line-height:1.3}
.sit.on{background:var(--chrome);border-color:var(--chrome);color:#fff}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink);background-image:repeating-linear-gradient(180deg,transparent 0 23px,rgba(0,0,0,.06) 23px 24px);line-height:24px}


/* store tokens */
:root{--chrome:#1D4A45;--wall:#E7E3DA;--wall-2:#DCD6CA;--peg:#F4F1EA;--metal-1:#E9ECEE;--metal-2:#A7B0B5;--metal-3:#6E787D;--fridge-frame:#2A3136;--fridge-in:#16242C;--led:#DFF4FF;--counter:#CBB79A;--belt:#2B2E31;--paper:#FFFDF6;--paper-ink:#23201a;--note:#FFF3A6;--stage:#15171B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chrome:#16403B;--wall:#2A2925;--wall-2:#22211E;--peg:#33312C;--metal-1:#C9CED1;--metal-2:#8C959A;--metal-3:#555E62;--fridge-frame:#0E1215;--fridge-in:#0D171D;--counter:#6E604D;--belt:#17191B;--paper:#F4F0E4;--note:#F2E48C;--stage:#0B0C0F}}
:root[data-theme="dark"]{--chrome:#16403B;--wall:#2A2925;--wall-2:#22211E;--peg:#33312C;--metal-1:#C9CED1;--metal-2:#8C959A;--metal-3:#555E62;--fridge-frame:#0E1215;--fridge-in:#0D171D;--counter:#6E604D;--belt:#17191B;--paper:#F4F0E4;--note:#F2E48C;--stage:#0B0C0F}

.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.item.hot{background:transparent!important;outline:0!important}
.ghost .pack{filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.shead .eyebrow{display:block}

/* welcome scene */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;padding-block:30px 120px}
.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.08}
.hero h1 em{font-style:normal;background:var(--tag);color:var(--tag-ink);padding:0 .18em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p.lead{font-size:17px;color:var(--muted);max-width:56ch;margin:0}
.tasks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.tasks li{display:flex;gap:12px;align-items:flex-start}
.tasks b{flex:none;width:28px;height:28px;border-radius:7px;background:var(--rack);color:#fff;display:grid;place-items:center;font:600 12px var(--f-mono)}
.scene{position:relative;background:linear-gradient(180deg,var(--wall) 0 72%,#D3CEC3 72% 100%);border-radius:18px;padding:16px 16px 0;overflow:hidden;min-height:440px;box-shadow:0 10px 30px rgba(20,30,25,.14)}
:root[data-theme="dark"] .scene{background:linear-gradient(180deg,var(--wall) 0 72%,#1e1d1a 72% 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene{background:linear-gradient(180deg,var(--wall) 0 72%,#1e1d1a 72% 100%)}}
.scene .gondola{max-width:440px;margin:0 auto}
.scene .bays{min-height:0}
.scene .bay{cursor:default;padding-top:10px}
.scene .bay:hover{background:transparent}
.scene-people{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 4%;pointer-events:none}
.scene-people .person{width:128px;height:auto}
.scene-people .person:first-child{animation:walkin 1s ease-out both}
.scene-people .person:last-child{animation:walkin2 1.2s .2s ease-out both}
@keyframes walkin2{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* ads: stickers + billboards */
.ads-layout{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.tray{position:sticky;top:78px;display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 170px);overflow:auto;padding:14px;background:#C9A77A;background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.4px);background-size:6px 6px;border-radius:12px;box-shadow:inset 0 0 0 6px #8C6A45,0 6px 16px rgba(60,40,10,.2)}
.tray h3{font-size:14px;color:#2d1f0e;padding:2px 4px}
.stmt{border:0;background:var(--note);color:var(--paper-ink);border-radius:2px;padding:10px 12px 10px 12px;text-align:left;cursor:grab;touch-action:none;display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.35;user-select:none;-webkit-user-select:none;width:100%;box-shadow:0 2px 3px rgba(0,0,0,.18);position:relative;transition:transform .15s}
.stmt:nth-child(3n){transform:rotate(-.8deg)}.stmt:nth-child(3n+1){transform:rotate(.6deg)}
.stmt:hover{transform:rotate(0) translateY(-2px)}
.stmt::before{content:"";position:absolute;top:-6px;left:50%;width:44px;height:12px;margin-left:-22px;background:rgba(255,255,255,.55);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.stmt .mono{color:#7a6a3a;flex:none;padding-top:1px;font-size:10.5px}
.stmt .cnt{margin-left:auto;font:700 11px var(--f-mono);background:#2a2200;color:var(--note);border-radius:999px;padding:1px 7px;flex:none}
.stmt.sel{outline:3px solid var(--rack);transform:scale(1.02)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bb{display:flex;flex-direction:column;cursor:pointer;border-radius:10px;transition:transform .15s}
.bb-frame{background:#2B2F33;border-radius:8px;padding:6px;box-shadow:0 8px 18px rgba(0,0,0,.2);position:relative}
.bb-frame::before{content:"";position:absolute;top:-7px;left:22%;right:22%;height:7px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#3a3f44,#6b7378,#3a3f44)}
.bb-poster{position:relative;border-radius:4px;min-height:132px;padding:10px 10px 10px 8px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;overflow:hidden}
.bb-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22) 0 18%,transparent 18%);pointer-events:none}
.bb-name{font:700 15px/1.12 var(--f-display);letter-spacing:-.01em;align-self:start;text-wrap:balance}
.bb-count{position:absolute;top:8px;right:8px;font:700 10.5px var(--f-mono);background:rgba(0,0,0,.35);color:#fff;border-radius:999px;padding:2px 7px}
.bb-slots{display:flex;flex-direction:column;gap:5px;padding:10px 4px 0}
.slot-note{background:var(--note);color:var(--paper-ink);font-size:12.5px;line-height:1.3;padding:6px 6px 6px 9px;border-radius:2px;display:flex;gap:6px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.slot-note:nth-child(2){transform:rotate(-.6deg)}.slot-note:nth-child(3){transform:rotate(.5deg)}
.slot-note span{flex:1}
.slot-note button{border:0;background:transparent;cursor:pointer;color:#6b5a2a;font-size:16px;line-height:1;padding:0 3px;border-radius:3px}
.slot-note button:hover{color:var(--err)}
.slot-empty{border:2px dashed var(--line);border-radius:4px;padding:6px 9px;font-size:12px;color:var(--muted)}
.bb.hot .bb-frame,.picking .bb .bb-frame{box-shadow:0 0 0 3px var(--tag),0 8px 18px rgba(0,0,0,.2)}
.bb.full .bb-frame{opacity:.9}

/* shoppers extras */
.q{touch-action:manipulation}
.bubble{color:#1b1f1e}
.person-wrap{animation:walkin .6s ease-out}
@keyframes walkin{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.shop-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
textarea.lined{background-image:repeating-linear-gradient(180deg,transparent 0 23px,rgba(0,0,0,.06) 23px 24px);line-height:24px}

/* stars: casting */
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cast{border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.stage{position:relative;height:170px;background:radial-gradient(ellipse 46% 70% at 50% 100%,rgba(255,236,170,.55),transparent 70%),linear-gradient(180deg,#07080a,var(--stage));display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;overflow:hidden}
.stage::before{content:"";position:absolute;top:-20px;left:50%;width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-top:200px solid rgba(255,240,190,.10);transform:translateX(-50%) rotate(180deg);transform-origin:top}
.stage::after{content:"";position:absolute;left:18%;right:18%;bottom:8px;height:12px;border-radius:50%;background:radial-gradient(rgba(255,236,170,.55),transparent 70%)}
.stage .pack{position:relative;z-index:1}
.stage .clap{position:absolute;top:10px;left:10px;font:700 10px var(--f-mono);letter-spacing:.08em;color:#fff;background:repeating-linear-gradient(135deg,#fff 0 6px,#111 6px 12px) top/100% 5px no-repeat,#1c1d20;padding:8px 8px 4px;border-radius:3px}
.stage .star-name{position:absolute;right:10px;top:10px;max-width:60%;text-align:right;color:#FFE08A;font:700 13px/1.2 var(--f-display);text-shadow:0 1px 8px rgba(255,200,80,.5)}
.cast-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.cast-body .nm{font-weight:700}

/* receipt */
.receipt{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:13.5px;max-width:420px;padding:22px 22px 30px;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.14);margin-inline:auto;width:100%}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px;background-repeat:repeat-x}
.receipt h3{font:700 16px var(--f-mono);text-align:center;letter-spacing:.06em}
.receipt .c{text-align:center;opacity:.75;font-size:12px}
.receipt hr{border:0;border-top:1.5px dashed rgba(0,0,0,.35);margin:12px 0}
.rline{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.rline b{font-weight:700}
.rline.total{font-size:15px;font-weight:700}
.barcode{height:44px;margin-top:14px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 13px)}
.stamp-big{position:absolute;right:16px;top:44%;transform:rotate(-14deg);border:3px solid #1B7F4D;color:#1B7F4D;font:700 20px var(--f-display);padding:4px 12px;border-radius:8px;opacity:.85;animation:stamp .5s .2s ease-out both}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.85}}
.finish-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* admin extras */
.pack-cell{display:flex;align-items:center;gap:8px}
.pack-thumb{height:56px;display:flex;align-items:flex-end}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.char-ed .person{width:110px;height:auto}

@media (max-width:900px){
  .hero,.finish-wrap{grid-template-columns:1fr}
  .scene{order:-1;min-height:340px}

  .ads-layout{grid-template-columns:1fr}
  .tray{position:static;max-height:44vh}
}
@media (max-width:560px){
  .bgrid,.cast-grid{grid-template-columns:1fr}
}

@media (max-width:900px){
  .store{grid-template-columns:1fr}
  .checkout{grid-template-columns:1fr}
  .till{display:none}
  .door{min-height:250px}
  .shop-scene{grid-template-columns:1fr}
  .aisle{min-height:400px}
}
@media (max-width:560px){
  .warehouse{flex-direction:column}
  .wh-label{border-right:0;border-bottom:2px dashed rgba(59,39,17,.35);padding:0 0 8px;flex-direction:row;align-items:center;gap:10px}
  .store{padding:8px}
  .person-wrap{width:175px;margin-bottom:70px}
  .bubble{top:12px;left:12px;right:12px;font-size:14px}

  .bays{min-height:118px}
  .lip{grid-template-columns:1fr 1fr 1fr;height:auto;padding:4px 6px}

  .counter-front{grid-template-columns:1fr 1fr 1fr;height:auto;padding:6px}
  .counter-front .lip-name{grid-column:1/-1;justify-self:start;margin-bottom:3px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){ .char-ed{grid-template-columns:1fr} }
@media (max-width:560px){
  .logo span.full{display:none}
  .bar .wrap{flex-wrap:nowrap;gap:8px}

}

.bb-name{padding-right:44px}

function hexRgb(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||"");const n=m?parseInt(m[1],16):0x888888;return [n>>16&255,n>>8&255,n&255];}
function rgbHex(r,g,b){return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");}
function shade(h,a){const [r,g,b]=hexRgb(h);return a<0?rgbHex(r*(1+a),g*(1+a),b*(1+a)):rgbHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);}
function lumOf(h){const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2];}

  const os=/Windows/.test(ua)?"Windows":/iPhone|iPad|iPod/.test(ua)?"iOS":/Android/.test(ua)?"Android":/Mac OS X|Macintosh/.test(ua)?"macOS":/Linux/.test(ua)?"Linux":"Other";
  const browser=/YaBrowser/.test(ua)?"Yandex":/Edg\//.test(ua)?"Edge":/OPR\//.test(ua)?"Opera":/Firefox\//.test(ua)?"Firefox":/Chrome\//.test(ua)?"Chrome":/Safari\//.test(ua)?"Safari":"Other";
  return {type,os,browser,screen:(screen.width||0)+"x"+(screen.height||0),ua:ua.slice(0,250)};

function runRef(){ return S.db.doc(`sessions/${S.uid}/runs/${S.run.sid}`); }
let saveTimer=null, saving=false, dirty=false;
function setSync(v){ if(S.sync===v) return; S.sync=v; const el=$("#sync"); if(el) el.outerHTML=syncHTML(); }
function scheduleSave(){ if(!S.run) return; S.run.updated=new Date().toISOString(); lsSet("csd_run",S.run); dirty=true; setSync("busy"); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); }
async function flush(){
  if(saving||!dirty||!S.run) return;
  if(!S.db||!S.uid){ setSync("bad"); return; }
  saving=true; dirty=false;
  try{ await runRef().set(clone(S.run)); setSync("ok"); }
  catch(e){ console.warn("save failed",e); dirty=true; setSync("bad"); setTimeout(flush,4000); }
  saving=false; if(dirty) flush();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ clearTimeout(saveTimer); flush(); } });

async function nextRespondentId(sid){
  const ref=S.db.doc("counter/main");
  for(let i=0;i<14;i++){
    try{
      const r=await ref.acquire({holder:sid,ttlMs:5000});
      if(r.acquired){ const s=await ref.get(); const n=((s.exists&&s.data().n)||0)+1; await ref.set({n,updated:new Date().toISOString()}); return n; }
    }catch(e){ console.warn("counter",e); }
    await sleep(250+Math.random()*500);
  }
  return null;
}

async function tryResume(){
  const cur=lsGet("csd_cur"); if(!cur||cur.uid!==S.uid) return;

function brands(){ return act(S.cfg.brands); }
function validate(screen){
  const r=S.run, bs=brands();
  if(screen===1){
    const placed=bs.filter(b=>r.shelf[b.id]);
    if(!placed.length) return t("needOne");
    if(S.cfg.settings.requireAll&&placed.length<bs.length) return t("needAll");
    if(placed.some(b=>!r.shelf[b.id].prio)) return t("needPrio");
  }
  if(screen===2){ if(!Object.values(r.img).some(a=>a&&a.length)) return t("needAd"); }
  if(screen===3){
    const cs=act(S.cfg.chars);
    const i=cs.findIndex(c=>!(r.shop[c.id]&&r.shop[c.id].brands&&r.shop[c.id].brands.length));
    if(i>=0){ S.shopper=i; return t("needShopper",{i:i+1}); }
  }
  return "";
}

/* ============ drop logic ============ */
function applyDrop(dragId, dropId){
  const [kind,id]=dragId.split(":"); const d=dropId.split(":"); const r=S.run; if(!r) return;
  if(kind==="brand"){
    if(d[0]==="lane"){ const prev=r.shelf[id]||{}; r.shelf[id]={shelf:+d[1],pos:+d[2],prio:prev.prio||null}; }
    else if(d[0]==="pool"){ delete r.shelf[id]; }
    S.sel=null;
  } else if(kind==="img"&&d[0]==="bcard"){
    const b=d[1]; const arr=r.img[b]||(r.img[b]=[]);
    if(arr.includes(id)){ /* already */ }
    else if(arr.length>=(+S.cfg.settings.maxImg||3)) { toast(t("maxReached",{n:arr.length})); return; }
    else arr.push(id);
  }
  S.msg=""; scheduleSave(); render();
}

/* ============ drag engine (pointer) ============ */
let drag=null, suppressClick=false;
document.addEventListener("pointerdown",e=>{
  if(e.button>0) return;
  const it=e.target.closest("[data-drag]"); if(!it) return;
  if(e.target.closest("[data-act]")&&!e.target.closest("[data-act]").hasAttribute("data-drag")) return;
  drag={el:it,id:it.dataset.drag,x:e.clientX,y:e.clientY,moved:false,ghost:null,pid:e.pointerId,hot:null};
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<7) return;
    drag.moved=true; const g=drag.el.cloneNode(true); g.classList.add("ghost"); g.classList.remove("sel");
    const rc=drag.el.getBoundingClientRect(); g.style.width=rc.width+"px"; drag.off=[e.clientX-rc.left,e.clientY-rc.top];
    document.body.appendChild(g); drag.ghost=g; document.body.classList.add("dragging");
    try{ drag.el.setPointerCapture(e.pointerId); }catch(_){}
  }
  e.preventDefault();
  drag.ghost.style.transform=`translate(${e.clientX-drag.off[0]}px,${e.clientY-drag.off[1]}px) rotate(-3deg)`;
  const under=document.elementFromPoint(e.clientX,e.clientY); const tgt=under&&under.closest("[data-drop]");
  if(tgt!==drag.hot){ drag.hot&&drag.hot.classList.remove("hot"); drag.hot=tgt; tgt&&tgt.classList.add("hot"); }
  // autoscroll
  const edge=60; if(e.clientY>innerHeight-edge-70) scrollBy(0,12); else if(e.clientY<edge+60) scrollBy(0,-12);
},{passive:false});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.pid)) return;
  const d=drag; drag=null;
  if(!d.moved) return;
  suppressClick=true; setTimeout(()=>suppressClick=false,50);
  d.ghost&&d.ghost.remove(); document.body.classList.remove("dragging"); d.hot&&d.hot.classList.remove("hot");
  if(!cancel&&d.hot) applyDrop(d.id,d.hot.dataset.drop);
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));
document.addEventListener("click",e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; } },true);
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-drop]:not(button)")){ e.preventDefault(); e.target.click(); } if(e.key==="Escape"&&S.sel){ S.sel=null; render(); } });

/* ============ render & events ============ */
const root=document.getElementById("app");
let pendingRender=false;
function render(force){
  const a=document.activeElement;
  if(!force&&a&&root.contains(a)&&a.matches("input[type=text],input[type=number],input:not([type]),textarea")){ pendingRender=true; return; }
  pendingRender=false;
  const y=scrollY;
  root.innerHTML=barHTML()+(S.view==="admin"&&S.isAdmin?renderAdmin():renderGame());
  document.body.classList.toggle("picking",!!S.sel);
  document.documentElement.lang=S.lang==="ky"?"ky":S.lang==="uz"?"uz":"ru";
  if(Math.abs(scrollY-y)>2) scrollTo(0,y);
}
root.addEventListener("focusout",()=>{ if(pendingRender) setTimeout(()=>{ if(pendingRender) render(); },0); });

root.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  const drop=e.target.closest("[data-drop]");
  if(el){
    const a=el.dataset.act;
    if(a==="pick"){
      const id=el.dataset.drag;
      // tapping a statement while a brand card is the target is handled by the card; here toggle selection
      S.sel=S.sel===id?null:id; render(); return;
    }
    if(a==="lang"){ S.lang=el.dataset.v; lsSet("csd_lang",S.lang); if(S.run){S.run.lang=S.lang;scheduleSave();} render(); return; }
    if(a==="view"){ S.view=el.dataset.v; if(S.view==="admin"&&S.adminTab==="results") loadResults(); render(); scrollTo(0,0); return; }
    if(a==="start"){ startRun(); return; }
    if(a==="next"){ const m=validate(S.screen); if(m){ S.msg=m; render(); return; } goScreen(S.screen+1); return; }
    if(a==="prev"){ goScreen(Math.max(1,S.screen-1)); return; }
    if(a==="finish"){ el.disabled=true; await finishRun(); return; }
    if(a==="newresp"){ newRespondent(); if(S.view==="admin") toast("Новая сессия: откройте игру, чтобы начать."); return; }
    if(a==="confirm"){ S.confirm=el.dataset.v||null; render(); return; }
    if(a==="prio"){ const x=S.run.shelf[el.dataset.id]; if(x){ x.prio=x.prio?(x.prio%3)+1:1; S.msg=""; scheduleSave(); render(); } return; }
    if(a==="unimg"){ const arr=S.run.img[el.dataset.b]||[]; S.run.img[el.dataset.b]=arr.filter(x=>x!==el.dataset.id); scheduleSave(); render(); return; }
    if(a==="shopper"){ const i=+el.dataset.i; if(i>=0){ S.shopper=i; S.msg=""; render(); } return; }
    if(a==="shopbrand"){ const c=el.dataset.c; const s=S.run.shop[c]||(S.run.shop[c]={brands:[],sit:null,reason:""}); const i=s.brands.indexOf(el.dataset.id); if(i>=0) s.brands.splice(i,1); else s.brands.push(el.dataset.id); S.msg=""; scheduleSave(); render(); return; }
    if(a==="shopsit"){ const c=el.dataset.c; const s=S.run.shop[c]||(S.run.shop[c]={brands:[],sit:null,reason:""}); s.sit=s.sit===el.dataset.id?null:el.dataset.id; scheduleSave(); render(); return; }
    // admin
    if(a==="atab"){ S.adminTab=el.dataset.v; S.adminConfirm=null; if(S.adminTab==="results") loadResults(); else render(); return; }
    if(a==="aconf"){ S.adminConfirm=el.dataset.v||null; render(); return; }
    if(a==="aadd"){ adminAdd(el.dataset.k); return; }
    if(a==="adel"){ S.adminConfirm=null; try{ await S.db.doc(`${el.dataset.k}/${el.dataset.id}`).delete(); }catch(err){ toast("Не удалось удалить"); } return; }
    if(a==="rdel"){ S.adminConfirm=null; try{ await S.db.doc(`sessions/${el.dataset.u}/runs/${el.dataset.id}`).delete(); }catch(err){ toast("Не удалось удалить"); } loadResults(); return; }
    if(a==="reload"){ loadResults(); return; }
    if(a==="unphoto"){ adminWrite("brands",el.dataset.id,"photo_id",null); return; }
    if(a==="exp"){ el.disabled=true; try{ await doExport(el.dataset.v); } finally { el.disabled=false; } return; }
    if(a==="wipe"){ const v=($("#wipe-confirm")||{}).value||""; if(v.trim().toUpperCase()!=="УДАЛИТЬ"){ toast("Введите слово УДАЛИТЬ, чтобы подтвердить."); return; } await wipeAll(); return; }
    return;
  }
  if(drop&&S.sel){ applyDrop(S.sel,drop.dataset.drop); }
});
root.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.upload){ uploadPhoto(el.dataset.upload,el.files&&el.files[0]); return; }
  if(el.dataset.act==="pset"){ const b=el.dataset.id,f=el.dataset.f,v=el.value?+el.value:null; const r=S.run;
    if(f==="shelf"){ if(!v) delete r.shelf[b]; else r.shelf[b]={shelf:v,pos:(r.shelf[b]||{}).pos||2,prio:(r.shelf[b]||{}).prio||null}; }
    else if(r.shelf[b]) r.shelf[b][f]=v;
    S.msg=""; scheduleSave(); render(true); return; }
  if(el.dataset.act==="celeb"){ const b=el.dataset.b; const cur=S.run.celeb[b]||{}; S.run.celeb[b]={id:el.value||null,custom:el.value==="custom"?(cur.custom||""):""}; scheduleSave(); render(true); if(el.value==="custom"){ const i=$("#cc-"+b); i&&i.focus(); } return; }
  if(el.dataset.act==="onlycomplete"){ S.onlyComplete=el.checked; return; }
  if(el.dataset.adm){ const v=el.type==="checkbox"?el.checked:(el.dataset.num?+el.value:el.value); adminWrite(el.dataset.adm,el.dataset.id,el.dataset.f,v); return; }
  if(el.dataset.set){ const v=el.type==="checkbox"?el.checked:Math.max(1,Math.min(17,+el.value||3)); S.db.doc("settings/main").set({...S.cfg.settings,[el.dataset.set]:v}).catch(()=>toast("Не удалось сохранить")); return; }
});
root.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.inp==="reason"){ const c=el.dataset.c; const s=S.run.shop[c]||(S.run.shop[c]={brands:[],sit:null,reason:""}); s.reason=el.value.slice(0,250); scheduleSave(); }
  if(el.dataset.inp==="celebtxt"){ const b=el.dataset.b; const cur=S.run.celeb[b]||{id:"custom"}; S.run.celeb[b]={id:cur.id||"custom",custom:el.value.slice(0,120)}; scheduleSave(); }

async function uploadPhoto(id,file){
  if(!file||!S.assets) return;
  if(file.size>8*1024*1024){ toast("Файл больше 8 МБ — уменьшите изображение."); return; }
  toast("Загружаю фото…");

async function wipeAll(){
  try{
    const parents=await S.db.collection("sessions").get();
    for(const p of parents.docs){ const q=await S.db.collection(`sessions/${p.id}/runs`).get(); for(const d of q.docs) await S.db.doc(`sessions/${p.id}/runs/${d.id}`).delete(); await S.db.doc(`sessions/${p.id}`).delete(); }
    await S.db.doc("counter/main").set({n:0,updated:new Date().toISOString()});
    S.adminConfirm=null; toast("Все ответы удалены, нумерация сброшена."); loadResults();
  }catch(e){ toast("Не удалось удалить: "+(e.message||e.code)); }
}


/* ============ CSD game: coded variables + codebook (shared by game and tools) ============ */
var CSD_DATA = (function(){
  var AGE_RU={1:"ребёнок",2:"подросток",3:"молодой",4:"средний возраст",5:"пожилой"};
  var GENDER_RU={1:"мужчина",2:"женщина"};
  var NAT_RU={1:"казах",2:"русский",3:"узбек",4:"кыргыз",5:"кореец",6:"уйгур",7:"татарин",8:"таджик",9:"другая"};
  var SOC_RU={1:"школьник",2:"студент",3:"офисный работник",4:"рабочий",5:"предприниматель",6:"домохозяйка",7:"пенсионер",8:"фрилансер",9:"спортсмен"};
  var SHELF={1:"Верхняя полка",2:"Средняя полка (уровень глаз)",3:"Нижняя полка",4:"Холодильник",5:"Прикассовая зона"};
  var POS={1:"Слева",2:"По центру",3:"Справа"};
  var PRIO={1:"1 — самый заметный",2:"2 — средний",3:"3 — низкий"};
  var YES={0:"нет",1:"да"};
  var STATUS={1:"завершена",2:"не завершена"};
  var DEVICE={1:"компьютер",2:"планшет",3:"телефон"};
  var LANG={1:"русский",2:"узбекский",3:"кыргызский"};
  var LANG_CODE={ru:1,uz:2,ky:3};
  function byNum(a,b){return (a.num||0)-(b.num||0);}
  function lab(map,id,f){ var x=map[id]; return x?(x[f]||x.name||x.text_ru||id):id; }
  function codeMap(arr,f){ var o={}; arr.slice().sort(byNum).forEach(function(x){ o[x.num]=String(x[f]||x.name||x.text_ru||x.id).trim(); }); return o; }

  /* codebook: one entry per flat variable, in the order the variables object uses */
  function codebook(cfg){
    var V=[];
    var B=cfg.brands.slice().sort(byNum), I=cfg.statements.slice().sort(byNum), C=cfg.characters.slice().sort(byNum);
    var sitV=codeMap(cfg.situations,"text_ru"), celV=codeMap(cfg.celebs,"name"); celV[999]="Свой вариант (см. zvezda_txt_b*)";
    function add(name,label,type,values){ V.push({name:name,label:label,type:type,values:values||null}); }
    add("respondent_id","ID респондента (из платформы)","string");
    add("session_id","ID сессии игры","string");
    add("status","Статус игры","numeric",STATUS);
    add("nachalo","Начало игры (ISO 8601)","string");
    add("konets","Окончание игры (ISO 8601)","string");
    add("dlitelnost_sek","Длительность игры, сек","numeric");
    add("ustroystvo","Тип устройства","numeric",DEVICE);
    add("yazyk","Язык игры","numeric",LANG);
    add("t_polki","Время на экране «Полки», сек","numeric");
    add("t_reklama","Время на экране «Реклама», сек","numeric");
    add("t_pokupateli","Время на экране «Покупатели», сек","numeric");
    add("t_zvezdy","Время на экране «Звёзды», сек","numeric");
    add("t_final","Время на экране «Финиш», сек","numeric");
    B.forEach(function(b){
      add("polka_b"+b.num, b.name+": полка","numeric",SHELF);
      add("pozitsiya_b"+b.num, b.name+": позиция на полке","numeric",POS);
      add("prioritet_b"+b.num, b.name+": приоритет","numeric",PRIO);
    });
    B.forEach(function(b){ I.forEach(function(s){ add("utv_b"+b.num+"_"+s.num, b.name+": "+s.text_ru,"numeric",YES); }); });
    C.forEach(function(c){
      B.forEach(function(b){ add("pokup_p"+c.num+"_b"+b.num, c.name+": предложена "+b.name,"numeric",YES); });
      add("situatsiya_p"+c.num, c.name+": ситуация потребления","numeric",sitV);
      add("obosnovanie_p"+c.num, c.name+": обоснование (свободный ответ)","string");
    });
    B.forEach(function(b){
      add("zvezda_b"+b.num, b.name+": знаменитость","numeric",celV);
      add("zvezda_txt_b"+b.num, b.name+": знаменитость, свой вариант","string");
    });
    return V;
  }

  /* flat coded variables for one game state (null = no answer) */
  function variables(cfg,run){
    var v={};
    var B=cfg.brands.slice().sort(byNum), I=cfg.statements.slice().sort(byNum), C=cfg.characters.slice().sort(byNum);
    var sitN={}; cfg.situations.forEach(function(s){ sitN[s.id]=s.num; });
    var celN={}; cfg.celebs.forEach(function(s){ celN[s.id]=s.num; });
    var st=run.screen_times||{}, d=run.device||{};
    v.respondent_id=run.respondent_id==null?null:String(run.respondent_id);
    v.session_id=run.sid||null;
    v.status=run.status==="complete"?1:2;
    v.nachalo=run.start||null; v.konets=run.end||null;
    v.dlitelnost_sek=run.duration_sec==null?null:run.duration_sec;
    v.ustroystvo={desktop:1,tablet:2,mobile:3}[d.type]||null;
    v.yazyk=LANG_CODE[run.lang]||null;
    v.t_polki=st.shelves==null?null:st.shelves; v.t_reklama=st.ads==null?null:st.ads; v.t_pokupateli=st.shoppers==null?null:st.shoppers; v.t_zvezdy=st.stars==null?null:st.stars; v.t_final=st.finish==null?null:st.finish;
    B.forEach(function(b){ var x=(run.shelf||{})[b.id]||{}; v["polka_b"+b.num]=x.shelf||null; v["pozitsiya_b"+b.num]=x.shelf?(x.pos||null):null; v["prioritet_b"+b.num]=x.shelf?(x.prio||null):null; });
    B.forEach(function(b){ var a=(run.img||{})[b.id]||[]; I.forEach(function(s){ v["utv_b"+b.num+"_"+s.num]=a.indexOf(s.id)>=0?1:0; }); });
    C.forEach(function(c){ var a=(run.shop||{})[c.id]||{}; var bs=a.brands||[];
      B.forEach(function(b){ v["pokup_p"+c.num+"_b"+b.num]=bs.indexOf(b.id)>=0?1:0; });
      v["situatsiya_p"+c.num]=a.sit?(sitN[a.sit]||null):null;
      v["obosnovanie_p"+c.num]=a.reason?String(a.reason):null; });
    B.forEach(function(b){ var x=(run.celeb||{})[b.id]||null; var code=null, txt=null;
      if(x){ if(x.id==="custom"||(!x.id&&x.custom)){ if(x.custom){ code=999; txt=x.custom; } } else if(x.id){ code=celN[x.id]||null; } }
      v["zvezda_b"+b.num]=code; v["zvezda_txt_b"+b.num]=txt; });
    return v;
  }

  /* long tables (one row per answer) — convenient for relational storage */
  function tables(cfg,run){
    var rid=run.respondent_id==null?null:String(run.respondent_id);
    var Bm={},Im={},Sm={},Cm={},Em={};
    cfg.brands.forEach(function(x){Bm[x.id]=x;}); cfg.statements.forEach(function(x){Im[x.id]=x;}); cfg.situations.forEach(function(x){Sm[x.id]=x;}); cfg.characters.forEach(function(x){Cm[x.id]=x;}); cfg.celebs.forEach(function(x){Em[x.id]=x;});
    var num=function(m,id){ return m[id]?m[id].num:null; };
    var t={placement:[],statements:[],shoppers:[],celebs:[]};
    Object.keys(run.shelf||{}).forEach(function(b){ var x=run.shelf[b]; t.placement.push({respondent_id:rid,marka:num(Bm,b),marka_id:b,marka_txt:lab(Bm,b,"name"),polka:x.shelf,pozitsiya:x.pos||null,prioritet:x.prio||null}); });
    Object.keys(run.img||{}).forEach(function(b){ (run.img[b]||[]).forEach(function(s){ t.statements.push({respondent_id:rid,marka:num(Bm,b),marka_id:b,utverzhdenie:num(Im,s),utverzhdenie_id:s,utverzhdenie_txt:lab(Im,s,"text_ru")}); }); });
    Object.keys(run.shop||{}).forEach(function(c){ var a=run.shop[c]; (a.brands||[]).forEach(function(b){ t.shoppers.push({respondent_id:rid,personazh:num(Cm,c),personazh_id:c,marka:num(Bm,b),marka_id:b,situatsiya:a.sit?num(Sm,a.sit):null,situatsiya_id:a.sit||null,obosnovanie:a.reason||null}); }); });
    Object.keys(run.celeb||{}).forEach(function(b){ var x=run.celeb[b]; if(!x) return; var custom=x.id==="custom"||(!x.id&&x.custom); if(custom&&!x.custom) return; if(!custom&&!x.id) return;
      t.celebs.push({respondent_id:rid,marka:num(Bm,b),marka_id:b,zvezda:custom?999:num(Em,x.id),zvezda_id:custom?"custom":x.id,zvezda_txt:custom?x.custom:lab(Em,x.id,"name")}); });
    return t;
  }
  return {codebook:codebook,variables:variables,tables:tables,dict:{AGE:AGE_RU,GENDER:GENDER_RU,NAT:NAT_RU,SOC:SOC_RU,SHELF:SHELF,POS:POS,PRIO:PRIO}};
})();
if(typeof module!=="undefined") module.exports=CSD_DATA;

/* ============ Embedded mode: config, platform messaging, local persistence ============ */
const CSD_VERSION="2.0.0";
const QS=new URLSearchParams(location.search);
const EMBED={
  embedded: window.parent!==window,
  parentOrigin: (function(o){ return (!o||o==="null"||o.startsWith("file:"))?"*":o; })(QS.get("parentOrigin")),
  rid: QS.get("rid")||null,
  sid: QS.get("sid")||null,
  returnUrl: QS.get("return")||null,
  cfg: null,
};
document.documentElement.classList.toggle("embedded",EMBED.embedded);
function post(type,payload){
  const msg=Object.assign({source:"csd-game",version:CSD_VERSION,type},payload||{});
  if(EMBED.embedded){ try{ window.parent.postMessage(msg,EMBED.parentOrigin); }catch(e){ console.warn("postMessage failed",e); } }
  try{ window.dispatchEvent(new CustomEvent("csd:"+type,{detail:msg})); }catch(e){}
}
function applyConfig(c){
  if(!c) return;
  EMBED.cfg=c;
  S.cfg={
    brands:(c.brands||[]).map(x=>({...x})),
    img:(c.statements||[]).map(x=>({...x})),
    sit:(c.situations||[]).map(x=>({...x})),
    chars:(c.characters||[]).map(x=>({...x})),
    celebs:(c.celebs||[]).map(x=>({...x})),
    settings:Object.assign({maxImg:3,requireAll:false},c.settings||{}),
  };
  S.dbState="ok";
}
function storeKey(){ return "csd_run_"+(EMBED.sid||EMBED.rid||"local"); }
function payload(){
  const r=S.run; const c=EMBED.cfg;
  return { respondent_id:r.respondent_id, session_id:r.sid, screen:r.screen, status:r.status, state:clone(r), variables:CSD_DATA.variables(c,r) };
}

/* ---- overrides of the hosted version's persistence ---- */
function flush(){
  if(!S.run) return;
  dirty=false;
  lsSet(storeKey(),S.run);
  post("progress",payload());
  setSync("ok");
}
async function nextRespondentId(){ return EMBED.rid; }
async function startRun(){
  const now=new Date();
  const sid=EMBED.sid||("g"+now.getTime().toString(36)+Math.random().toString(36).slice(2,6));
  S.run={sid,respondent_id:EMBED.rid,status:"in_progress",start:now.toISOString(),end:null,duration_sec:null,
    lang:S.lang,device:deviceInfo(),screen:1,screen_times:{},shelf:{},img:{},shop:{},celeb:{},updated:now.toISOString()};
  S.screen=1; S.shopper=0; S.sel=null; S.msg=""; enteredAt=Date.now();
  post("started",{respondent_id:S.run.respondent_id,session_id:sid});
  render(); scheduleSave();
}
function resumeFrom(state){
  if(!state||!state.sid) return false;
  S.run=state;
  if(state.status==="complete"){ S.screen=6; render(); return true; }
  S.screen=Math.min(5,Math.max(1,state.screen||1)); enteredAt=Date.now(); render(); return true;
}
async function tryResume(){
  const local=lsGet(storeKey());
  if(local&&local.sid&&(!EMBED.rid||String(local.respondent_id)===String(EMBED.rid))){ if(resumeFrom(local)) toast(t("restored")); }
}
async function finishRun(){
  const r=S.run; if(!r) return;
  r.screen_times.finish=(r.screen_times.finish||0)+Math.round((Date.now()-enteredAt)/1000);
  const end=new Date(); r.end=end.toISOString(); r.duration_sec=Math.round((end-new Date(r.start))/1000); r.status="complete"; r.screen=6; r.lang=S.lang;
  clearTimeout(saveTimer); lsSet(storeKey(),r);
  const p=payload(); p.tables=CSD_DATA.tables(EMBED.cfg,r); p.duration_sec=r.duration_sec;
  post("complete",p);
  sendRemote(p,true);
  S.screen=6; render(); confetti();
  if(EMBED.returnUrl){
    const url=EMBED.returnUrl.replace("{rid}",encodeURIComponent(r.respondent_id||"")).replace("{sid}",encodeURIComponent(r.sid));
    setTimeout(()=>{ try{ (EMBED.embedded?window.top:window).location.href=url; }catch(e){ location.href=url; } },2500);
  }
}
function newRespondent(){ lsDel(storeKey()); S.run=null; S.screen=0; S.confirm=null; render(); }

/* thanks screen: in a survey the respondent continues with the platform's own navigation */
Object.assign(T.ru,{embedDone:"Ответы переданы в анкету. Можно продолжать.",embedNext:"Продолжите анкету — нажмите «Далее» ниже."});
Object.assign(T.uz,{embedDone:"Javoblar anketaga yuborildi. Davom etishingiz mumkin.",embedNext:"Anketani davom ettiring — quyidagi «Keyingi» tugmasini bosing."});
Object.assign(T.ky,{embedDone:"Жооптор анкетага жөнөтүлдү. Уланта бериңиз.",embedNext:"Анкетаны улантыңыз — төмөндөгү «Кийинки» баскычын басыңыз."});
function renderThanks(){
  return `<main class="wrap"><section class="hero finish-wrap">
    <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <h1>${esc(t("thanksTitle"))}</h1><p class="lead">${esc(EMBED.embedded?t("embedDone"):t("thanksBody"))}</p>
      ${EMBED.embedded?`<p class="muted" style="margin:0">${esc(t("embedNext"))}</p>`:((window.CSD_CONFIG||{}).endpoint?(S.sync==="bad"?`<div class="notice err">${esc(t("offline"))}</div>`:""):`<button class="btn primary" data-act="newresp">${esc(t("newResp"))}</button>`)}
    </div>
    ${S.run?receiptHTML(true):""}
  </section></main>`;
}


/* save immediately at screen changes and when the page is being closed */
function goScreen(n){
  if(S.run&&SCREEN_KEY[S.screen]){ const k=SCREEN_KEY[S.screen]; S.run.screen_times[k]=(S.run.screen_times[k]||0)+Math.round((Date.now()-enteredAt)/1000); }
  enteredAt=Date.now(); S.screen=n; S.sel=null; S.msg=""; if(S.run){ S.run.screen=n; S.run.updated=new Date().toISOString(); clearTimeout(saveTimer); flush(); if(typeof sendRemote==="function") sendRemote(payload(),false); }
  render(); window.scrollTo(0,0);
}
window.addEventListener("pagehide",()=>{ if(S.run&&dirty){ clearTimeout(saveTimer); flush(); } });


/* ---- public mode: send answers to the Google Sheet web app ---- */
const ENDPOINT=((window.CSD_CONFIG||{}).endpoint||"").trim();
const PUBLIC=!EMBED.embedded&&!!ENDPOINT;
document.documentElement.classList.toggle("public",PUBLIC);
function sendRemote(p,final){
  if(!ENDPOINT||!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:\/])/.test(ENDPOINT)) return;
  const body=JSON.stringify({source:"csd-game",version:CSD_VERSION,type:final?"complete":"progress",respondent_id:p.respondent_id,session_id:p.session_id,status:p.status,screen:p.screen,variables:p.variables,state:p.state,page:location.href.split("#")[0]});
  if(final) lsSet("csd_pending",body);
  setSync("busy");
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",keepalive:body.length<60000,headers:{"Content-Type":"text/plain;charset=utf-8"},body})
    .then(()=>{ if(final) lsDel("csd_pending"); setSync("ok"); })
    .catch(()=>{ setSync("bad"); if(final) setTimeout(retryPending,10000); });
}
function retryPending(){
  const body=lsGet("csd_pending"); if(!body||!ENDPOINT) return;
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:typeof body==="string"?body:JSON.stringify(body)})
    .then(()=>{ lsDel("csd_pending"); setSync("ok"); render(); })
    .catch(()=>setTimeout(retryPending,15000));
}
window.addEventListener("pagehide",()=>{
  if(!ENDPOINT||!S.run||S.run.status==="complete"||!navigator.sendBeacon) return;
  try{ const p=payload(); navigator.sendBeacon(ENDPOINT,new Blob([JSON.stringify({source:"csd-game",version:CSD_VERSION,type:"progress",respondent_id:p.respondent_id,session_id:p.session_id,status:p.status,screen:p.screen,variables:p.variables,state:p.state})],{type:"text/plain;charset=utf-8"})); }catch(e){}
});

/* ---- messages from the platform ---- */
window.addEventListener("message",e=>{
  if(EMBED.parentOrigin!=="*"&&e.origin!==EMBED.parentOrigin) return;
  const m=e.data; if(!m||m.source!=="csd-host") return;
  if(m.type==="init"){
    if(m.config) applyConfig(m.config);
    if(m.respondent_id!=null) EMBED.rid=String(m.respondent_id);
    if(m.session_id) EMBED.sid=String(m.session_id);
    if(m.lang&&T[m.lang]){ S.lang=m.lang; }
    if(m.state&&m.state.sid) resumeFrom(m.state); else { tryResume(); render(); }
  } else if(m.type==="saved"){ setSync("ok"); }
  else if(m.type==="getState"){ if(S.run) post("progress",payload()); }
});

/* ---- boot ---- */
(function boot(){
  const l=QS.get("lang"); if(l&&T[l]) S.lang=l;
  if(QS.has("new")) lsDel(storeKey());
  applyConfig(window.CSD_CONFIG||null);
  if(!EMBED.cfg){ S.dbState="none"; }
  render();
  tryResume();
  post("ready",{respondent_id:EMBED.rid,session_id:EMBED.sid});
  if(PUBLIC) retryPending();
})();
